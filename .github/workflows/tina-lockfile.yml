name: 'Update Tina Lockfile'
on:
  push:
    paths:
      - 'tina/config.ts'
      - '.github/workflows/tina-lockfile.yml'
  workflow_dispatch:
jobs:
  update-lockfile:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
    steps:
      - name: 'Checkout Repository with PAT'
        uses: 'actions/checkout@v4'
        with:
          token: ${{ secrets.PAT_TOKEN }}
      - name: 'Setup Node Environment'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
      - name: 'Install Dependencies'
        run: 'npm install'
      - name: 'Generate Lockfile'
        env:
          NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        run: 'npx tinacms build --skip-cloud-checks'
      - name: 'Commit and Push Changes'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'bot@noreply.github.com'
          git add tina/ tina-lock.json package-lock.json
          git commit -m 'chore: force auto-update tina config via PAT' || true
          git push
